{% extends "auth_base.html" %}

{% block title %}Accedi - Customer Intelligence Monitor{% endblock %}

{% block auth_content %}
<h2>Accedi</h2>
<p class="subtitle">Inserisci le credenziali dell'amministratore.</p>

{% if error %}
<div class="alert">{{ error }}</div>
{% endif %}

<form method="post" action="/api/auth/login">
    <input type="hidden" name="next" value="{{ next|default('/') }}">

    <div class="form-group">
        <label for="username">Utente</label>
        <input type="text" id="username" name="username" value="{{ username|default('') }}"
               autocomplete="username" autofocus required>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-auth">Accedi</button>
</form>
{% endblock %}
