<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Intelligence Monitor{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #2c3e50;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 420px;
            padding: 36px 34px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 26px;
        }

        .auth-logo h1 { font-size: 22px; color: #2c3e50; }
        .auth-logo p { font-size: 13px; color: #7f8c8d; margin-top: 4px; }

        h2 { font-size: 19px; color: #2c3e50; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 22px; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dfe4e8;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }

        small { display: block; color: #7f8c8d; font-size: 12px; margin-top: 5px; }

        .btn-auth {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-auth:hover { background: #2980b9; }

        .alert {
            background: #f8d7da;
            color: #721c24;
            padding: 11px 13px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .note {
            background: #eaf4fb;
            color: #1b4f72;
            padding: 11px 13px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🔍 CIM</h1>
            <p>Customer Intelligence Monitor</p>
        </div>

        {% block auth_content %}{% endblock %}
    </div>
</body>
</html>
